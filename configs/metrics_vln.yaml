# 3. VLN accuracy for the report (docs/METRICS.md): scripts/hvln_experiment.py --config configs/metrics_vln.yaml
#
# The VLN as the robot runs it on its own map: the map package made by the robot's SLAM and annotated by a person,
# the robot localising itself in it (package_frame:=map; the simulator's start pose is not used), Qwen3-VL-8B.
# 11 tasks x 3 seeds = 33 episodes; seed 0 starts at the task spawn, seeds 1-2 perturb it (<= 0.3 m, <= 20 deg),
# and the localizer always gets the unperturbed spawn as its rough initial pose (initial_pose: spawn).
# Change map_package if the package is not maps/campus (path inside the container).
tasks: [inspect_conveyor, inspect_dock_en, inspect_dock_cart_ko, inspect_servers_office,
        inspect_meeting_table_en, inspect_station_paraphrase, json_agent_subgoals,
        go_fire_cabinet_ko, check_electrical_panel_en, inspect_pump_guard_ko, check_tank_gauge_en]
seeds: [0, 1, 2]
conditions:
  vln_8b_map: {planner_mode: vln, vlm_model: "qwen3-vl:8b-instruct"}
launch_args:
  map_package: /ws/maps/campus
  package_frame: map
  initial_pose: spawn
  camera_rate_hz: 30.0
  render_shadows: true
  realtime_factor: 1.0
  monitor: false
  timeout_s: 900.0
episode_wall_timeout_s: 3600
