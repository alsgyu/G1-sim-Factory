# Instructions an external agent may send, with the place each one should end in (by a person's reading of the
# instruction) and a start pose in the campus_dev map frame (x, y, yaw). Starts are the spawns of
# G1-sim-Factory/configs/vln_tasks.yaml moved into the map frame (map = world - (-11.94, 3.82)); they only place the
# robot.
# Used by tests/test_instructions.py and scripts/plan_offline.py --tasks.
tasks:
  colleague_servers_en:
    instruction: "Go to the operations control room and check whether the status indicator lights on the server rack are on."
    start: [-0.06, -0.02, 0.0]
    expect: office_control
  servers_ko:
    instruction: "사무동 관제실에 가서 서버 랙의 상태 표시등이 켜져 있는지 확인해."
    start: [23.94, -7.62, 0.0]
    expect: office_control
  conveyor_ko:
    instruction: "조립 라인으로 가서 컨베이어 위에 상자가 놓여 있는지 확인해."
    start: [-0.06, -0.02, 0.0]
    expect: assembly_line
  dock_en:
    instruction: "Go to the charging area and check whether the free charging dock is empty."
    start: [-0.06, -7.62, 0.0]
    expect: charging
  dock_cart_ko:
    instruction: "충전 구역의 3번 충전 도크에 AMR 카트가 주차되어 있는지 확인해."
    start: [-0.06, -7.62, 0.0]
    expect: charging
  meeting_en:
    instruction: "Go to the meeting room and check whether anyone is sitting at the meeting table."
    start: [37.94, -3.82, 0.0]
    expect: office_meeting
  station_paraphrase_ko:
    instruction: "부품 품질을 확인하는 곳에 가서 두 번째 비전 검사 장비 위에 부품이 올려져 있는지 봐줘."
    start: [23.94, -0.02, 3.1416]
    expect: inspection
  panel_en:
    instruction: "Find the blue electrical panel on the east wall of the assembly area and check whether it carries a high-voltage warning."
    start: [23.94, -7.62, 1.5708]
    expect: assembly_line
  pump_guard_ko:
    instruction: "사무동 남쪽 펌프실에 가서 펌프와 모터 사이에 커플링 가드가 설치되어 있는지 확인해."
    start: [41.94, -3.82, 0.0]
    expect: pump_room
  tank_en:
    instruction: "Go to the pump room and check whether the pressure tank TK-101 has a pressure gauge."
    start: [23.94, -7.62, 0.0]
    expect: pump_room
  lounge_json_steps:
    instruction:
      task_id: agent-007
      steps:
        - {goal: "cross the warehouse-office bridge into the office", region: null}
        - {goal: "enter the staff lounge", region: office_lounge}
        - {goal: "find the vending machine and stand in front of it", region: office_lounge}
      subgoals: [warehouse_office_bridge, vending_machine]
      target: vending machine
      question: 자판기가 넘어지지 않고 정상적으로 서 있는지 확인해.
    start: [23.94, -7.62, 1.5708]
    expect: office_lounge
  workstations_en:
    instruction: "Please head to the engineering workstations and see if the monitors are turned on."
    start: [-0.06, -0.02, 0.0]
    expect: office_workstations
  inspection_ko:
    instruction: "품질 검사 구역으로 이동해서 검사대 위에 부품이 있는지 확인해 줘."
    start: [37.94, -3.82, 3.1416]
    expect: inspection
  storage_from_to_en:
    instruction: "From the charging station, walk through the main aisle to the material storage and count the pallets."
    start: [24.0, -12.0, 1.5708]
    expect: material_storage
  pump_via_ko:
    instruction: "연결 통로를 거쳐서 펌프실 통로로 가."
    start: [-0.06, -0.02, 0.0]
    expect: pump_passage
  lounge_keyword_en:
    instruction: "Check whether the vending machine is standing upright."
    start: [37.94, -3.82, 0.0]
    expect: office_lounge
  control_spaced_ko:
    instruction: "통제실로 이동해 줘"
    start: [-0.06, -0.02, 0.0]
    expect: office_control
  meeting_nospace_ko:
    instruction: "회의실에서 프로젝터 화면이 켜져 있는지 확인해"
    start: [23.94, -7.62, 0.0]
    expect: office_meeting
  json_place:
    instruction: {task_id: t-1, place: pump_room}
    start: [-0.06, -0.02, 0.0]
    expect: pump_room
  json_pose:
    instruction: {task_id: t-2, goal: {x: 45.0, y: -9.5, yaw: 0.0}}
    start: [-0.06, -0.02, 0.0]
    expect: office_lounge
