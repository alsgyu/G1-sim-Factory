# Semantic map for hierarchical VLN (layer 1: language -> map goal poses).
#
# The eight semantic zones are added automatically from configs/factory.yaml
# (pose = zone `goal`, facing the zone centre). This file adds landmarks inside
# or between zones. `pose` is an obstacle-free APPROACH pose [x, y, yaw] in the
# world/map frame (metres, radians): where G1 should stand, facing the object
# from ~1.5-1.8 m so the whole object is inside the head camera view.
# tests/test_planning.py checks every pose keeps >= 0.6 m from mapped obstacles.
#
# Aliases are matched case-insensitively and with whitespace removed, so Korean
# particles ("검사구역으로", "충전 구역에서") still match. Longest alias wins.
# In a real deployment this file is replaced by a perception-built semantic map
# (e.g. open-vocabulary detections fused on a SLAM map); the interface is the same.
zone_aliases:
  material_storage: [material storage, materials storage, storage area, storage zone, rack area, shelving area, 자재 창고, 자재창고, 자재 보관, 선반 구역, 창고 구역]
  assembly_line: [assembly line, assembly area, assembly zone, production line, 조립 라인, 조립라인, 조립 구역, 생산 라인]
  inspection: [quality inspection, inspection area, inspection zone, inspection, qa area, 품질 검사, 검사 구역, 검사구역, 검사장]
  charging: [charging station, charging area, charging zone, charging, 충전 구역, 충전구역, 충전소, 충전 스테이션]
  office_workstations: [engineering workstations, workstations, workstation room, work room, office workstations, 업무실, 사무 공간, 작업실, 엔지니어링 업무실]
  office_meeting: [meeting room, conference room, office meeting room, 회의실, 미팅룸]
  office_lounge: [staff lounge, lounge, break room, office lounge, 휴게실, 라운지]
  office_control: [operations control, control room, operations room, office control room, 관제실, 통제실, 운영실]
landmarks:
  - id: main_aisle_crossing
    label: Main aisle crossing
    zone: transit
    pose: [0.0, 0.0, 0.0]
    aliases: [main aisle crossing, aisle crossing, central crossing, center of the warehouse, warehouse center, 중앙 교차로, 통로 교차점, 창고 중앙]
  - id: loading_dock_1
    label: Loading dock 01
    zone: material_storage
    pose: [-19.0, 14.6, 1.5708]
    aliases: [loading dock 1, loading dock 01, dock 1, dock 01, dock one, 1번 도크, 도크 1, 1번 하역장]
  - id: loading_dock_2
    label: Loading dock 02
    zone: material_storage
    pose: [-11.0, 14.6, 1.5708]
    aliases: [loading dock 2, loading dock 02, dock 2, dock 02, dock two, 2번 도크, 도크 2, 2번 하역장]
  - id: loading_dock_3
    label: Loading dock 03
    zone: assembly_line
    pose: [7.0, 14.6, 1.5708]
    aliases: [loading dock 3, loading dock 03, dock 3, dock 03, dock three, 3번 도크, 도크 3, 3번 하역장]
  - id: loading_dock_4
