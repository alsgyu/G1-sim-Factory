# Semantic map: what a person annotates on the robot's SLAM map, plus hidden
# evaluation targets.
#
# Given to the robot (hierarchical VLN context):
#   * the eight zones from configs/factory.yaml (region rectangles + names) and
#     their aliases below,
#   * landmarks with `annotated: true` - fixed infrastructure a person marks on a
#     SLAM map (aisle crossing, loading docks, warehouse-office bridge, office entrance).
# NOT given to the robot (`annotated: false`): fine-grained targets such as
# "charger 3", "inspection station 2" or "the red fire extinguisher cabinet".
# The VLN must find those with its camera. Their `object` [x, y] (the physical
# object), optional `footprint` [[x1, y1, x2, y2], ...] (its floor outline; several
# boxes when any instance satisfies the instruction) and `pose` [x, y, yaw] (a good
# viewing pose) are used only for evaluation and for the map-lookup baseline
# (planner_mode:=oracle). Evaluation distances are measured to the footprint.
# All coordinates: world/map frame, metres, radians. tests/test_hvln.py checks
# every pose keeps >= 0.6 m from mapped obstacles.
#
# Aliases are matched case-insensitively and with whitespace removed, so Korean
# particles ("검사구역으로", "충전 구역에서") still match. Longest alias wins.
zone_aliases:
  material_storage: [material storage, materials storage, storage area, storage zone, rack area, shelving area, 자재 창고, 자재창고, 자재 보관, 선반 구역, 창고 구역]
  assembly_line: [assembly line, assembly area, assembly zone, production line, 조립 라인, 조립라인, 조립 구역, 생산 라인]
  inspection: [quality inspection, inspection area, inspection zone, inspection, qa area, 품질 검사, 검사 구역, 검사구역, 검사장]
  charging: [charging station, charging area, charging zone, charging, 충전 구역, 충전구역, 충전소, 충전 스테이션]
  office_workstations: [engineering workstations, workstations, workstation room, work room, office workstations, 업무실, 사무 공간, 작업실, 엔지니어링 업무실]
  office_meeting: [meeting room, conference room, office meeting room, 회의실, 미팅룸]
  office_lounge: [staff lounge, lounge, break room, office lounge, 휴게실, 라운지]
  office_control: [operations control, control room, operations room, office control room, 관제실, 통제실, 운영실]
  pump_room: [pump room, pump station, utility room, plant room, mechanical room, 펌프실, 펌프룸, 설비실, 기계실, 유틸리티실]
